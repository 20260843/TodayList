<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>Today List - 테마 설정</title>
	<style>
		    	/* 다크모드 스타일 */
		body.dark-mode {
			background-color: #121212;
			color: #f1f1f1;
		}


		body.dark-mode .theme-btn {
			background-color: #2a2a2a;
			border-color: #444444;
			color: #e0e0e0;
		}

		body.dark-mode .theme-btn.active {
			border-color: #64b5f6;
			background-color: #1e3a5f;
			color: #ffffff;
		}
	</style>
</head>
<body>
	<header>
		<nav>
			<ul>
				<li><a href="index.html">메인</a></li>
				<li><a href="cal.html">캘린더</a></li>
				<li><a href="timer.html">타이머</a></li>
				<li><a href="stats.html">통계</a></li>
				<li><a href="theme.html">테마</a></li>
				<li><a href="profile.html">프로필</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section class="theme-selection">
			<h2>테마 설정 [ Theme Settings ]</h2>
			
			<div class="theme-toggle-container" style="text-align: center; margin: 40px 0;">
				<p>원하는 화면 테마를 선택하세요.</p>
				
				<!-- 테마 전환 버튼 -->
				<div class="theme-tab-group" style="display: inline-flex; gap: 20px; margin-top: 20px;">
					<button type="button" class="theme-btn active" id="btn-light" style="padding: 15px 25px; cursor: pointer;">
						<span class="icon" style="font-size: 24px; display: block;">☀️</span>
						<span>라이트 모드</span>
					</button>
					
					<button type="button" class="theme-btn" id="btn-dark" style="padding: 15px 25px; cursor: pointer;">
						<span class="icon" style="font-size: 24px; display: block;">🌙</span>
						<span>다크 모드</span>
					</button>
				</div>
			</div>
		</section>

		<aside>
			<div class="theme-status-info">
				<p style="text-align: center;">적용된 테마: <strong id="current-theme-text">라이트 모드</strong></p>
			</div>
		</aside>
	</main>
	<script>
		const btnLight = document.getElementById('btn-light');
		const btnDark = document.getElementById('btn-dark');
		const currentThemeText = document.getElementById('current-theme-text');
		const body = document.body;

		function setDarkMode() {
			body.classList.add('dark-mode');
			btnDark.classList.add('active');
			btnLight.classList.remove('active');
			currentThemeText.textContent = '다크 모드';
			localStorage.setItem('theme', 'dark'); // 선택한 테마 저장
		}

		function setLightMode() {
			body.classList.remove('dark-mode');
			btnLight.classList.add('active');
			btnDark.classList.remove('active');
			currentThemeText.textContent = '라이트 모드';
			localStorage.setItem('theme', 'light'); // 선택한 테마 저장
		}

		// 버튼 클릭 이벤트 연결
		btnDark.addEventListener('click', setDarkMode);
		btnLight.addEventListener('click', setLightMode);

		// 페이지가 열릴 때 이전에 저장된 테마가 있으면 자동 적용
		if (localStorage.getItem('theme') === 'dark') {
			setDarkMode();
		}
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Today List - 프로필</title>
<style>
	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
    		font-weight: 100;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
    		font-weight: 200;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
    		font-weight: 300;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    		font-weight: 400;
    		font-display: swap;
	}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    		font-weight: 500;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    		font-weight: 600;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    		font-weight: 700;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
    		font-weight: 800;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
    		font-weight: 900;
    		font-display: swap;
		}
    	* {
        		box-sizing: border-box;
    	}

	body {
		margin: 0;
		min-height: 100vh;
		background-color: #ffffff;
		color: #1a1a1a;
		font-family: 'Jua', 'Paperozi', sans-serif;
		display: flex;
		flex-direction: column;
		transition: background-color 0.25s ease, color 0.25s ease;
	}

	header {
		width: 100%;
		padding: 22px 56px 0;
	}

	header nav ul {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		justify-content: flex-end;
		gap: 24px;
	}

	header nav a {
		color: #1a1a1a;
		text-decoration: none;
		font-size: 1.05rem;
		font-weight: 500;
	}

	header nav a:hover {
		opacity: 0.7;
	}

	main {
		width: 100%;
		max-width: 820px;
		margin: 0 auto;
		padding: 36px 32px 64px;
		flex: 1;
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: 32px;
	}

	.profile-info {
		display: flex;
		align-items: center;
		gap: 36px;
	}

	.profile-image {
		flex-shrink: 0;
		width: 175px;
		height: 215px;
		border-radius: 6px;
		overflow: hidden;
		background-color: #f3f3f3;
		border: 1px solid #e2e2e2;
	}

	.profile-image img {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}

	.profile-details {
		display: flex;
		flex-direction: column;
		gap: 10px;
	}

	.profile-details h2 {
		margin: 0 0 4px;
		font-size: 1.65rem;
		font-weight: 700;
		color: #111111;
	}

	.profile-details p {
		margin: 0;
		font-size: 1.25rem;
		line-height: 1.5;
		color: #222222;
	}

	.profile-details strong {
		font-weight: 700;
	}

	.profile-motivation {
		display: flex;
		flex-direction: column;
		gap: 10px;
	}

	.profile-motivation h3 {
		margin: 0;
		font-size: 1.35rem;
		font-weight: 700;
		color: #111111;
	}

	.profile-motivation p {
		margin: 0;
		font-size: 1.15rem;
		line-height: 1.7;
		color: #2a2a2a;
	}

	/*다크모드 스타일*/
	body.dark-mode {
		background-color: #121212;
		color: #f1f1f1;
	}

	body.dark-mode header nav a {
		color: #f1f1f1;
	}

	body.dark-mode .profile-image {
		background-color: #222222;
		border-color: #303030;
	}

	body.dark-mode .profile-details h2,
	body.dark-mode .profile-motivation h3 {
		color: #ffffff;
	}

	body.dark-mode .profile-details p {
		color: #eeeeee;
	}

	body.dark-mode .profile-motivation p {
		color: #e2e2e2;
	}
</style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="cal.html">캘린더</a></li>
                <li><a href="timer.html">타이머</a></li>
                <li><a href="stats.html">통계</a></li>
                <li><a href="theme.html">테마</a></li>
                <li><a href="profile.html">프로필</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 프로필 사진 및 기본 정보 -->
        <section class="profile-info">
            <div class="profile-image">
                <img src="photo.jpg" alt="최규림 프로필 사진">
            </div>

            <div class="profile-details">
                <h2>기본 정보</h2>
                <p><strong>이름 ㅣ</strong> 최규림</p>
                <p><strong>나이 ㅣ</strong> 24세 (03년생)</p>
                <p><strong>학과 ㅣ</strong> 디지털콘텐츠학과</p>
            </div>
        </section>

        <!-- 제작 동기 -->
        <section class="profile-motivation">
            <h3>■ 제작 동기</h3>
            <p>
                바쁜 일상과 과제 일정 속에서 할 일을 관리할 때, 기존의 메모장이나 캘린더 앱은 시각적인 지루함을 주곤 했습니다.
                작업에 집중할 수 있는 편안한 분위기와 함께, 직관적으로 오늘의 할 일을 관리할 수 있는 웹 공간의 필요성을 느꼈고
                이왕 만드는 거 실용성 있는 홈페이지를 바라기 때문입니다.
            </p>
        </section>
    </main>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>
</body>
</html>

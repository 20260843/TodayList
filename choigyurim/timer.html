<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Today List - 타이머</title>
<style>
	/*다크모드 스타일*/
	body.dark-mode {
        background-color: #121212;
        color: #f1f1f1;
    	}

    	body.dark-mode .timer-display,
    	body.dark-mode .timer-display h1 {
        color: #ffffff !important;
    	}

    	body.dark-mode .timer-display h1:hover {
        border-color: #64b5f6;
    	}

   	 body.dark-mode .timer-controls button {
        color: #64b5f6;
    	}

    	body.dark-mode .timer-controls span {
        color: #444444;
    	}

    	body.dark-mode .sound-section {
        border-top: 1px solid #333333;
        color: #e0e0e0;
    	}

    	body.dark-mode .sound-section h3 {
        color: #ffffff;
    	}
</style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="cal.html">캘린더</a></li>
                <li><a href="timer.html">타이머</a></li>
                <li><a href="stats.html">통계</a></li>
                <li><a href="theme.html">테마</a></li>
		<li><a href="profile.html">프로필</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 중앙 타이머 -->
        <section>
            <!-- 타이머 시간 표시 -->
            <div class="timer-display">
                <h1 id="timer-text" contenteditable="true">00:00</h1>
            </div>

            <!-- 시작 / 일시정지 / 리셋 버튼 -->
            <div class="timer-controls">
                <button type="button" id="btn-start">시작</button>
                <span>|</span>
                <button type="button" id="btn-pause">일시정지</button>
                <span>|</span>
                <button type="button" id="btn-reset">리셋</button>
            </div>
        </section>

        <!-- 배경 미디어 -->
        <section class="sound-section">
            <h3>배경 미디어</h3>
            <div style="margin: 10px 0;">
                <button type="button" class="sound-btn" data-sound="rain">빗소리</button> | 
                <button type="button" class="sound-btn" data-sound="fire">장작소리</button> | 
                <button type="button" class="sound-btn" data-sound="cafe">재즈음악</button>
            </div>
            <div>
                <label for="volume-slider" style="font-size: 0.9rem; margin-right: 5px;">볼륨</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" style="vertical-align: middle;">
            </div>
        </section>
    </main>
<script>
	if (localStorage.getItem('theme') === 'dark') {
		document.body.classList.add('dark-mode');
	}

	// 1. 타이머 기능 구현
    	const timerText = document.getElementById('timer-text');
    	const btnStart = document.getElementById('btn-start');
    	const btnPause = document.getElementById('btn-pause');
    	const btnReset = document.getElementById('btn-reset');

    	let timerInterval = null;
    	let totalSeconds = 0;

	// 엔터키 입력 시 줄바꿈 방지 및 입력 완료
    	timerText.addEventListener('keydown', function(e) {
        	if (e.key === 'Enter') {
            	e.preventDefault();
            	timerText.blur();
        	}
    	});

    	function parseTimeText() {
        	const text = timerText.textContent.trim();
        	const parts = text.split(':');
        if (parts.length === 2) {
            	const mins = parseInt(parts[0], 10) || 0;
            	const secs = parseInt(parts[1], 10) || 0;
            	return (mins * 60) + secs;
        	}
        	return 0;
    	}

    	function displayTime(seconds) {
        	const m = Math.floor(seconds / 60);
        	const s = seconds % 60;
        	timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    	}

    	// 시작 버튼
    	btnStart.addEventListener('click', function() {
        	if (timerInterval) return; // 이미 실행 중이면 중복 실행 방지

        	totalSeconds = parseTimeText();
        	if (totalSeconds <= 0) return;

        	timerInterval = setInterval(function() {
            		if (totalSeconds > 0) {
                		totalSeconds--;
                		displayTime(totalSeconds);
            			} else {
                		clearInterval(timerInterval);
                		timerInterval = null;
                		alert('타이머가 종료되었습니다');
            		}
        	}, 1000);
    	});

    	// 일시정지 버튼
    	btnPause.addEventListener('click', function() {
        	clearInterval(timerInterval);
        	timerInterval = null;
   	 });

    	// 리셋 버튼
   	 btnReset.addEventListener('click', function() {
        	clearInterval(timerInterval);
        	timerInterval = null;
        	totalSeconds = 0;
        	timerText.textContent = '00:00';
    	});

	// 내 컴퓨터 파일 기반 미디어 연동
    	const soundFiles = {
        	rain: 'rain.mp3', // 빗소리 파일 이름
        	fire: 'fire.mp3', // 장작소리 파일 이름
        	cafe: 'jazz.mp3'  // 재즈음악 파일 이름
    	};

    	let currentAudio = null;
    	let currentActiveBtn = null;

    	const soundButtons = document.querySelectorAll('.sound-btn');
    	const volumeSlider = document.getElementById('volume-slider');

    	soundButtons.forEach(button => {
        	button.addEventListener('click', function() {
            		const soundKey = this.getAttribute('data-sound');
            		const filePath = soundFiles[soundKey];

            // 이미 같은 버튼을 눌렀다면 재생/정지 토글
            if (currentActiveBtn === this && currentAudio) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    this.classList.add('playing');
                } else {
                    currentAudio.pause();
                    this.classList.remove('playing');
                }
                return;
            }

            // 다른 소리가 나고 있었다면 정지
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            soundButtons.forEach(btn => btn.classList.remove('playing'));

            // 새 오디오 객체 생성 및 재생
            currentAudio = new Audio(filePath);
            currentAudio.loop = true; // 무한 반복
            currentAudio.volume = volumeSlider.value; // 현재 슬라이더 볼륨 적용
            currentAudio.play().catch(error => {
                console.log("재생 실패: 파일 경로를 확인해주세요.", error);
                alert("오디오 파일을 찾을 수 없습니다. HTML 파일과 같은 폴더에 파일이 있는지 확인해주세요!");
            });

            this.classList.add('playing');
            currentActiveBtn = this;
        });
    });

    // 볼륨 조절 슬라이더 연동
    volumeSlider.addEventListener('input', function() {
        if (currentAudio) {
            currentAudio.volume = this.value;
        }
    });
</script>
</body>
</html>

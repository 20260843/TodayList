<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Today List - 타이머</title>
<style>
	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
    		font-weight: 100;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
    		font-weight: 200;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
    		font-weight: 300;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    		font-weight: 400;
    		font-display: swap;
	}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    		font-weight: 500;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    		font-weight: 600;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    		font-weight: 700;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
    		font-weight: 800;
    		font-display: swap;
		}

	@font-face {
    		font-family: 'Paperozi';
    		src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
    		font-weight: 900;
    		font-display: swap;
		}
	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		min-height: 100vh;
		background-color: #ffffff;
		color: #1a1a1a;
		font-family: 'Paperozi', sans-serif;
		display: flex;
		flex-direction: column;
		transition: background-color 0.25s ease, color 0.25s ease;
	}

	header {
		width: 100%;
		padding: 20px 48px 0;
	}

	header nav ul {
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		justify-content: flex-end;
		gap: 20px;
	}

	header nav a {
		color: #1a1a1a;
		text-decoration: none;
		font-size: 1.05rem;
		font-weight: 500;
	}

	header nav a:hover {
		opacity: 0.7;
	}

	main {
		width: 100%;
		max-width: 780px;
		margin: 0 auto;
		padding: 24px 32px 48px;
		flex: 1;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 36px;
	}

	.timer-section {
		width: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 18px;
	}

	.timer-stage {
		width: 100%;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.timer-circle {
		width: 240px;
		height: 240px;
		border-radius: 50%;
		background-color: #f4f4f4;
		border: 2px solid #e0e0e0;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 0;
		transition: background-color 0.25s ease, border-color 0.25s ease;
	}

	.timer-display {
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100%;
		height: 100%;
	}

	.timer-display h1 {
		margin: 0;
		padding: 0;
		font-size: 3.3rem;
		line-height: 1;
		font-weight: 700;
		letter-spacing: 0;
		text-align: center;
		color: #111111;
		outline: none;
		border-bottom: 2px solid transparent;
		cursor: text;
		font-variant-numeric: tabular-nums;
	}

	.timer-display h1:hover,
	.timer-display h1:focus {
		border-bottom-color: #888888;
	}

	.timer-controls {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 12px;
	}

	.timer-controls button {
		background: none;
		border: none;
		padding: 4px 6px;
		font-family: inherit;
		font-size: 1.05rem;
		color: #1a1a1a;
		cursor: pointer;
	}

	.timer-controls button:hover {
		opacity: 0.65;
	}

	.timer-controls span {
		color: #cccccc;
		font-size: 0.95rem;
		user-select: none;
	}

	.sound-section {
		width: 100%;
		max-width: 680px;
		background-color: #f8f8f8;
		border: 1px solid #e5e5e5;
		border-radius: 6px;
		padding: 18px 24px;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 14px;
	}

	.sound-section h3 {
		align-self: flex-start;
		margin: 0;
		font-size: 1rem;
		font-weight: 600;
		color: #222222;
	}

	.sound-buttons {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 12px;
		flex-wrap: wrap;
	}

	.sound-btn {
		background: none;
		border: none;
		padding: 4px 6px;
		font-family: inherit;
		font-size: 1.05rem;
		color: #222222;
		cursor: pointer;
		border-radius: 4px;
	}

	.sound-btn:hover {
		opacity: 0.7;
	}

	.sound-btn.playing {
		color: #2563eb;
		text-decoration: underline;
		text-underline-offset: 4px;
	}

	.sound-divider {
		color: #cccccc;
		font-size: 0.95rem;
		user-select: none;
	}

	.volume-box {
		width: 100%;
		max-width: 420px;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 10px;
	}

	.volume-box label {
		font-size: 0.95rem;
		color: #333333;
		white-space: nowrap;
	}

	#volume-slider {
		flex: 1;
		accent-color: #222222;
		cursor: pointer;
	}

	/*다크모드 스타일*/
	body.dark-mode {
		background-color: #121212;
		color: #f1f1f1;
	}

	body.dark-mode header nav a {
		color: #f1f1f1;
	}

	body.dark-mode .timer-circle {
		background-color: #242424;
		border-color: #2f2f2f;
	}

	body.dark-mode .timer-display h1 {
		color: #ffffff;
	}

	body.dark-mode .timer-display h1:hover,
	body.dark-mode .timer-display h1:focus {
		border-bottom-color: #64b5f6;
	}

	body.dark-mode .timer-controls button {
		color: #e5e5e5;
	}

	body.dark-mode .timer-controls span {
		color: #555555;
	}

	body.dark-mode .sound-section {
		background-color: #222222;
		border-color: #2e2e2e;
		color: #f1f1f1;
	}

	body.dark-mode .sound-section h3 {
		color: #e5e5e5;
	}

	body.dark-mode .sound-btn {
		color: #f1f1f1;
	}

	body.dark-mode .sound-btn.playing {
		color: #64b5f6;
	}

	body.dark-mode .sound-divider {
		color: #555555;
	}

	body.dark-mode .volume-box label {
		color: #dddddd;
	}

	body.dark-mode #volume-slider {
		accent-color: #ffffff;
	}
</style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="cal.html">캘린더</a></li>
                <li><a href="timer.html">타이머</a></li>
                <li><a href="stats.html">통계</a></li>
                <li><a href="theme.html">테마</a></li>
                <li><a href="profile.html">프로필</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 중앙 타이머 -->
        <section class="timer-section">
            <div class="timer-stage">
                <div class="timer-circle">
                    <div class="timer-display">
                        <h1 id="timer-text" contenteditable="true" title="숫자를 입력하면 MM:SS로 자동 변환됩니다">00:00</h1>
                    </div>
                </div>
            </div>

            <!-- 시작 / 일시정지 / 리셋 버튼 -->
            <div class="timer-controls">
                <button type="button" id="btn-start">시작</button>
                <span aria-hidden="true">|</span>
                <button type="button" id="btn-pause">일시정지</button>
                <span aria-hidden="true">|</span>
                <button type="button" id="btn-reset">리셋</button>
            </div>
        </section>

        <!-- 배경 미디어 -->
        <section class="sound-section">
            <h3>배경 미디어</h3>
            <div class="sound-buttons">
                <button type="button" class="sound-btn" data-sound="rain">빗소리</button>
                <span class="sound-divider" aria-hidden="true">|</span>
                <button type="button" class="sound-btn" data-sound="fire">장작소리</button>
                <span class="sound-divider" aria-hidden="true">|</span>
                <button type="button" class="sound-btn" data-sound="cafe">카페음악</button>
            </div>
            <div class="volume-box">
                <label for="volume-slider">볼륨</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </section>
    </main>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    // 타이머 기능
    const timerText = document.getElementById('timer-text');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');

    let timerInterval = null;
    let totalSeconds = 0;

    function formatDigitsToClock(rawText) {
        const digits = rawText.replace(/\D/g, '').slice(-4).padStart(4, '0');
        const mins = digits.slice(0, 2);
        const secs = digits.slice(2, 4);
        return `${mins}:${secs}`;
    }

    function placeCaretAtEnd(el) {
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(el);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function syncClockFormat(moveCaretToEnd = false) {
        const formatted = formatDigitsToClock(timerText.textContent);
        if (timerText.textContent !== formatted) {
            timerText.textContent = formatted;
        }
        if (moveCaretToEnd && document.activeElement === timerText) {
            placeCaretAtEnd(timerText);
        }
    }

    // 숫자 입력 시 콜론 자동 반영
    timerText.addEventListener('input', function() {
        syncClockFormat(true);
    });

    timerText.addEventListener('blur', function() {
        syncClockFormat(false);
    });

    // 엔터키 입력 시 줄바꿈 방지 및 입력 완료
    timerText.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            syncClockFormat(false);
            timerText.blur();
        }
    });

    function parseTimeText() {
        const formatted = formatDigitsToClock(timerText.textContent);
        timerText.textContent = formatted;
        const [minsStr, secsStr] = formatted.split(':');
        const mins = parseInt(minsStr, 10) || 0;
        const secs = parseInt(secsStr, 10) || 0;
        return (mins * 60) + secs;
    }

    function displayTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // 시작 버튼
    btnStart.addEventListener('click', function() {
        if (timerInterval) return;

        totalSeconds = parseTimeText();
        if (totalSeconds <= 0) return;

        timerInterval = setInterval(function() {
            if (totalSeconds > 0) {
                totalSeconds--;
                displayTime(totalSeconds);
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                alert('타이머가 종료되었습니다');
            }
        }, 1000);
    });

    // 일시정지 버튼
    btnPause.addEventListener('click', function() {
        clearInterval(timerInterval);
        timerInterval = null;
    });

    // 리셋 버튼
    btnReset.addEventListener('click', function() {
        clearInterval(timerInterval);
        timerInterval = null;
        totalSeconds = 0;
        timerText.textContent = '00:00';
    });

    // 내 컴퓨터 파일 기반 미디어 연동
    const soundFiles = {
        rain: 'rain.mp3',
        fire: 'fire.mp3',
        cafe: 'jazz.mp3'
    };

    let currentAudio = null;
    let currentActiveBtn = null;

    const soundButtons = document.querySelectorAll('.sound-btn');
    const volumeSlider = document.getElementById('volume-slider');

    soundButtons.forEach(button => {
        button.addEventListener('click', function() {
            const soundKey = this.getAttribute('data-sound');
            const filePath = soundFiles[soundKey];

            if (currentActiveBtn === this && currentAudio) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    this.classList.add('playing');
                } else {
                    currentAudio.pause();
                    this.classList.remove('playing');
                }
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            soundButtons.forEach(btn => btn.classList.remove('playing'));

            currentAudio = new Audio(filePath);
            currentAudio.loop = true;
            currentAudio.volume = volumeSlider.value;
            currentAudio.play().catch(error => {
                console.log("재생 실패: 파일 경로를 확인해주세요.", error);
                alert("오디오 파일을 찾을 수 없습니다. HTML 파일과 같은 폴더에 파일이 있는지 확인해주세요!");
            });

            this.classList.add('playing');
            currentActiveBtn = this;
        });
    });

    // 볼륨 조절 슬라이더 연동
    volumeSlider.addEventListener('input', function() {
        if (currentAudio) {
            currentAudio.volume = this.value;
        }
    });
</script>
</body>
</html>

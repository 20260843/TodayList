<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Today List - 통계</title>
<style>
    /* 다크모드 스타일 */
    body.dark-mode {
        background-color: #121212;
        color: #f1f1f1;
    }

    body.dark-mode .chart-container {
        border-bottom: 2px solid #333;
    }

    body.dark-mode .chart-bar {
        background-color: #64b5f6;
    }

    body.dark-mode .chart-label,
    body.dark-mode .chart-percent,
    body.dark-mode p {
        color: #aaa;
    }

    body.dark-mode .completed-list li {
        border-bottom: 1px solid #2a2a2a;
        color: #ccc;
    }
</style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="cal.html">캘린더</a></li>
                <li><a href="timer.html">타이머</a></li>
                <li><a href="stats.html">통계</a></li>
                <li><a href="theme.html">테마</a></li>
                <li><a href="profile.html">프로필</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 막대그래프 -->
        <section>
            <h2>[ 📊 이번 주 할 일 달성률 ]</h2>
            <div class="chart-container" id="chart-container">
            </div>
            <p id="weekly-avg" style="text-align: center; font-weight: 600; margin-top: 10px;">이번 주 평균 달성률 : 0%</p>
        </section>

        <!-- 지난 완료 항목 -->
        <section style="border-top: 1px solid #eee; padding-top: 20px;">
            <h2>[ 지난 완료 항목 ]</h2>
            <ul class="completed-list" id="completed-list">
            </ul>
        </section>
    </main>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    // 통계 및 차트 렌더링
    function loadStats() {
        const savedTodos = JSON.parse(localStorage.getItem('todoStatsList')) || [];
        const todayPercent = parseInt(localStorage.getItem('todayPercent')) || 0;

        const chartContainer = document.getElementById('chart-container');
        const weeklyAvgText = document.getElementById('weekly-avg');
        const completedList = document.getElementById('completed-list');

        // 요일 설정 (월 ~ 일)
        const weekDays = ['월', '화', '수', '목', '금', '토', '일'];
        
        // 오늘 요일 구하기 (0: 일요일, 1: 월요일, ... 6: 토요일)
        const now = new Date();
        let dayIndex = now.getDay() - 1; // 월요일을 0으로 맞춤
        if (dayIndex === -1) dayIndex = 6; // 일요일이면 6

        chartContainer.innerHTML = '';
        let totalScore = 0;
        let activeDaysCount = 0;

        weekDays.forEach((day, index) => {
            // 오늘 요일에는 현재 메인 페이지의 달성률을 반영하고, 나머지는 저장된 기록이나 0으로 처리
            let score = 0;
            if (index === dayIndex) {
                score = todayPercent;
            }

            if (score > 0) {
                totalScore += score;
                activeDaysCount++;
            }

            // 막대 래퍼 생성
            const barWrap = document.createElement('div');
            barWrap.className = 'chart-bar-wrap';

            // 퍼센트 숫자 라벨
            const percentLabel = document.createElement('span');
            percentLabel.className = 'chart-percent';
            percentLabel.textContent = `${score}%`;

            // 막대 본체
            const bar = document.createElement('div');
            bar.className = 'chart-bar';
            bar.style.height = `${score}%`; // 0~100% 높이 매칭

            // 요일 라벨 (월, 화, 수...)
            const label = document.createElement('span');
            label.className = 'chart-label';
            label.textContent = day;

            barWrap.appendChild(percentLabel);
            barWrap.appendChild(bar);
            barWrap.appendChild(label);
            chartContainer.appendChild(barWrap);
        });

        // 평균 달성률 계산
        const avgPercent = activeDaysCount > 0 ? Math.round(totalScore / 7) : 0;
        weeklyAvgText.textContent = `이번 주 평균 달성률 : ${todayPercent}%`;

        // 완료된 항목 목록 렌더링
        completedList.innerHTML = '';
        const completedItems = savedTodos.filter(item => item.completed);

        if (completedItems.length === 0) {
            completedList.innerHTML = '<li style="justify-content: center; color: #888;">완료된 항목이 없습니다.</li>';
        } else {
            completedItems.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span>- ${item.date || '오늘'} : ${item.text}</span> <span style="color: #4a90e2; font-weight: 600;">[완료]</span>`;
                completedList.appendChild(li);
            });
        }
    }

    loadStats();
</script>
</body>
</html>
